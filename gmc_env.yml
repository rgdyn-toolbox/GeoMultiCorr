name: gmc_env
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - geopandas>=1.0.0
  - geoutils=0.1.17
  - numba=0.*
  - numpy>=1,<3
  - matplotlib=3.*
  - pyproj>=3.4,<4
  - rasterio>=1.3,<2
  - scipy=1.*
  - tqdm
  - ipython
  - ipykernel
  - xarray
  - rioxarray
  - gdal
  - geocube
  - scikit-image
  - scikit-gstat
  - pytransform3d
  - pillow
  - affine
  - pandas
  - pyogrio
  - shapely