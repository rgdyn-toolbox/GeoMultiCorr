name: gmc_env
channels:
  - conda-forge
dependencies:
  - python>=3.11
  - pytest
  - pytest-cov
  - geopandas>=1.0.0
  - geoutils=0.2.5
  - numba=0.*
  - numpy>=1,<3
  - matplotlib=3.*
  - plotly>=5
  - ipywidgets
  - pyproj>=3.4,<4
  - rasterio>=1.3,<2
  - scipy=1.*
  - tqdm
  - ipython
  - ipykernel
  - jupyterlab
  - xarray
  - rioxarray
  - gdal
  - libgdal
  - rasterstats
  - geocube
  - scikit-image
  - scikit-gstat
  - pytransform3d
  - pillow
  - affine
  - pandas
  - pyogrio
  - shapely
  - geemap
  - earthengine-api
  - geodatasets
  - contextily
  - rich
  - alive-progress
  - black
  - flake8
  - mypy
  - pip:
      - geemap
      - earthengine-api